name: market-monitor-production

services:
  market-monitor:
    build:
      context: ..
      dockerfile: Dockerfile
    image: market-monitor:production-staged
    network_mode: host
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /run:rw,noexec,nosuid,size=16m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MARKET_MONITOR_ENV: production
      MARKET_MONITOR_BIND_HOST: 127.0.0.1
      MARKET_MONITOR_PORT: "8000"
      MARKET_MONITOR_WORKERS: "1"
      MARKET_MONITOR_ALLOWED_HOSTS: 127.0.0.1,localhost
      MARKET_MONITOR_DATA_DIR: /var/lib/market-monitor
      MARKET_MONITOR_OWNER_PASSWORD_FILE: /run/secrets/owner_password
      MARKET_MONITOR_WORKER_POLL_SECONDS: "1"
      MARKET_MONITOR_TDX_BAR_RETENTION_DAYS: "5"
      MARKET_MONITOR_WEBHOOK_ENABLED: "false"
      MARKET_MONITOR_OFFICIAL_ENABLED: "false"
      MARKET_MONITOR_THRESHOLD_ACTIVATION: "0"
      MARKET_MONITOR_TRADING_CALENDAR_FILE: /etc/market-monitor/calendar.json
      MARKET_MONITOR_LISTING_REFERENCE_FILE: /etc/market-monitor/listing-reference.json
    volumes:
      - market_monitor_data:/var/lib/market-monitor
      - market_monitor_artifacts:/var/lib/market-monitor/artifacts
      - market_monitor_backups:/var/backups/market-monitor
      - ./calendars/sse-szse-2026.json:/etc/market-monitor/calendar.json:ro
      - ./references/listing-reference-2026-09-08.json:/etc/market-monitor/listing-reference.json:ro
    secrets:
      - owner_password
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          assert urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200;
          assert urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6g
        reservations:
          cpus: "1.0"
          memory: 1g

volumes:
  market_monitor_data:
  market_monitor_artifacts:
  market_monitor_backups:

secrets:
  owner_password:
    file: ./secrets/owner-password
